<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f8f8f6" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="حنانه بیوتی — آتلیه زیبایی در تهران. رزرو نوبت، منوی خدمات، لوک‌بوک مدل مو و استایل‌یاب." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>حنانه بیوتی</title>
    <style>
      #splash { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 16px; background: #f8f8f6; }
      #splash img { width: 76px; height: 76px; border-radius: 24px; box-shadow: 0 18px 40px rgb(28 23 20 / 0.18); animation: splash 1.2s ease-in-out infinite alternate; }
      @media (prefers-color-scheme: dark) { #splash { background: #171d1a; } }
      @keyframes splash { to { transform: scale(1.05); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="splash" aria-hidden="true"><img src="/icons/icon-192.png" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
