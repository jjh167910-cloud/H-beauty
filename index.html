<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ee" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="حنانه بیوتی | رزرو نوبت، منوی خدمات، لوک‌بوک مدل مو و استایل‌یاب" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="حنانه" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="حنانه بیوتی" />
    <meta property="og:image" content="/og.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>حنانه بیوتی</title>
    <style>
      #splash { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; background: #f7f3ee; color: #7a5a33; font-family: serif; }
      #splash img { width: 72px; height: 72px; border-radius: 22px; box-shadow: 0 18px 40px rgb(28 23 20 / 0.18); animation: splash 1.2s ease-in-out infinite alternate; }
      #splash small { letter-spacing: 0.3em; font-size: 10px; }
      @media (prefers-color-scheme: dark) { #splash { background: #0f0d0c; color: #dfc08e; } }
      @keyframes splash { to { transform: scale(1.05); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="splash" aria-hidden="true"><img src="/icons/icon-192.png" alt="" /><small dir="ltr">HAUTE BEAUTÉ</small></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
