name: H-Beauty Try-On v27.7 isolated staging

on:
  push:
    branches: [staging/ai-tryon-v275-github]
    paths:
      - '.github/workflows/hbeauty-tryon-v277-staging.yml'
      - 'staging/ai-tryon-v275/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hbeauty-v277-isolated-staging
  cancel-in-progress: true

jobs:
  deploy-isolated-staging:
    if: github.ref == 'refs/heads/staging/ai-tryon-v275-github'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a22c80a102037bf59a1a25426cb93d66' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for pinned release ZIP
        id: source
        shell: bash
        run: |
          if gh release view hbeauty-tryon-v27.7-staging-source >/dev/null 2>&1; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::error title=Staging archive missing::No pinned v27.5 source release was found. Staging deployment was safely blocked; production was not touched.'
            exit 1
          fi
      - name: Download approved source ZIP
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hbeauty-stage"
          gh release download hbeauty-tryon-v27.7-staging-source --pattern 'HBeauty_v27_7_Isolated_Staging_Kit.zip' --dir "$RUNNER_TEMP/hbeauty-stage"
      - name: Prove source, offline assets and isolation
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/hbeauty-stage/HBeauty_v27_7_Isolated_Staging_Kit.zip"
          echo "3baa0804b30c5cfa41c7c839c618a43b7aa3b143d1f9dfa5d1ace82fe8c90e9a  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/hbeauty-stage"
          cd "$RUNNER_TEMP/hbeauty-stage/HBeauty_v27_7_Staging_Kit"
          python verify_staging.py
          python - <<'PY'
          from pathlib import Path
          import json
          c=json.loads(Path('wrangler.jsonc').read_text())
          assert c['name']=='hbeauty-tryon-v277-staging', 'REFUSE: wrong Worker name'
          assert c['name']!='h-beauty' and c['workers_dev'] is True
          assert c['assets']['directory']=='./public'
          assert 'routes' not in c and 'route' not in c
          manifest=json.loads(Path('public/V277_FULL_INTEGRITY.json').read_text())
          cpu=json.loads(Path('public/V277_CPU_INTEGRITY.json').read_text())
          assert len(manifest)==339 and len(cpu)==93
          print('PASS: staging-only Worker, 339 verified full assets, 93 CPU assets')
          PY
      - name: Deploy only the staging Worker
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error title=Cloudflare token missing::Set repository secret CLOUDFLARE_API_TOKEN; no deployment was attempted.'
            exit 1
          fi
          cd "$RUNNER_TEMP/hbeauty-stage/HBeauty_v27_7_Staging_Kit"
          npx --yes wrangler@4 deploy --config wrangler.jsonc 2>&1 | tee "$RUNNER_TEMP/hbeauty-v275-deploy.log"
      - name: Verify HTTPS staging responses
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' "$RUNNER_TEMP/hbeauty-v275-deploy.log" | head -n1 || true)"
          if [ -z "$url" ]; then echo '::error::Wrangler did not report a public staging workers.dev URL'; exit 1; fi
          echo "Staging URL: $url"
          echo "### Verified isolated try-on staging" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          export HBEAUTY_STAGING_URL="$url"
          cd "$RUNNER_TEMP/hbeauty-stage/HBeauty_v27_7_Staging_Kit"
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          base=os.environ['HBEAUTY_STAGING_URL'].rstrip('/')
          manifest=json.loads(Path('public/V277_FULL_INTEGRITY.json').read_text())
          for rel in ['sw.js','models/face-mesh-478.onnx','tryon/segment.txt','wasm/vision_wasm_internal.wasm','litertjs/wasm/litert_wasm_internal.wasm','selfie-sixclass-litert-v276.mjs']:
              req=urllib.request.Request(base+'/'+rel, headers={'User-Agent':'HBeauty-Staging-QA/1.0'})
              with urllib.request.urlopen(req, timeout=60) as res:
                  assert res.status==200,(rel,res.status)
                  body=res.read()
                  assert 'text/html' not in res.headers.get('Content-Type','').lower(),rel
              local_file=Path('public')/rel
              assert local_file.is_file(),rel
              expected=hashlib.sha256(local_file.read_bytes()).hexdigest()
              if rel!='sw.js':
                  assert manifest['./'+rel]==expected,rel
              # sw.js is generated after the immutable full-app manifest, and must
              # be validated against the pinned staging archive's actual bytes.
              assert hashlib.sha256(body).hexdigest()==expected,rel
              print('HTTPS verified',rel,len(body),'bytes')
          with urllib.request.urlopen(base+'/',timeout=30) as res:
              assert res.status==200 and b'html' in res.read(2000).lower()
          print('PASS: remote staging assets match pinned local SHA-256 hashes')
          PY
      - name: Emit release decision
        if: always()
        shell: bash
        run: |
          echo 'Production h-beauty Worker is never targeted by this workflow.'
          echo 'Staging is only confirmed if archive, deploy and HTTPS verification all succeed.'
          echo 'Physical Android segmentation and neural makeup realism remain NO-GO.'
