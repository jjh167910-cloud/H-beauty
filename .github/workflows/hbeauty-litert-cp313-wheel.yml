name: H-Beauty staging LiteRT wheel for exact local-model QA
on:
  push:
    branches: [staging/ai-tryon-v275-github]
    paths:
      - '.github/workflows/hbeauty-litert-cp313-wheel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-linux-cp313:
    if: github.ref == 'refs/heads/staging/ai-tryon-v275-github'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download official Linux CPython 3.13 LiteRT wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheels
          python -m pip download --only-binary=:all: --no-deps --dest wheels ai-edge-litert
          ls -lh wheels
          sha256sum wheels/* | tee wheels/sha256.txt
      - name: Upload runtime wheel for exact v27.5 model validation
        uses: actions/upload-artifact@v4
        with:
          name: hbeauty-litert-linux-cp313-runtime-wheel
          path: wheels/
          retention-days: 7
