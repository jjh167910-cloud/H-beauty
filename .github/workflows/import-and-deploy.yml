name: Import and deploy Hananeh Beauty
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  import-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a22c80a102037bf59a1a25426cb93d66
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify archive parts
        shell: bash
        run: |
          set -euo pipefail
          test -s upload/H-beauty-portable.part-01
          test -s upload/H-beauty-portable.part-02
          cat upload/H-beauty-portable.part-01 upload/H-beauty-portable.part-02 > /tmp/h-beauty.zip
          echo "86584e5306484f756e65b540e841fc039504b614e5b687fef3ecd3c429c7b7f3  /tmp/h-beauty.zip" | sha256sum -c -
          unzip -tq /tmp/h-beauty.zip
      - name: Import clean portable project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hbeauty-import
          unzip -q /tmp/h-beauty.zip -d /tmp/hbeauty-import
          test -f /tmp/hbeauty-import/package.json
          test -f /tmp/hbeauty-import/wrangler.jsonc
          test -f /tmp/hbeauty-import/src/main.tsx
          rsync -a --exclude='/.github/' --exclude='/upload/' /tmp/hbeauty-import/ ./
          git rm -f -- upload/H-beauty-portable.part-01 upload/H-beauty-portable.part-02
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import portable Hananeh Beauty salon app'
            git push origin HEAD:main
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static SPA
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h-beauty-dist
          path: dist
          retention-days: 14
      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@4 deploy
      - name: Explain unconfigured deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo 'Build succeeded, but Cloudflare publishing was skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.'
