name: H-Beauty staging LiteRT.js offline WASM research package
on:
  push:
    branches: [staging/ai-tryon-v275-github]
    paths:
      - '.github/workflows/hbeauty-litertjs-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  obtain-versioned-runtime:
    if: github.ref == 'refs/heads/staging/ai-tryon-v275-github'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain official pinned LiteRT.js package from npm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p litertjs
          cd litertjs
          npm pack '@litertjs/core@2.5.3' --silent
          npm pack '@litertjs/wasm-utils@2.5.3' --silent
          sha256sum ./*.tgz | tee sha256.txt
          ls -lh ./*.tgz
      - name: Upload research-only runtime package for local bundle/QA
        uses: actions/upload-artifact@v4
        with:
          name: hbeauty-litertjs-core-2-5-3-pinned
          path: litertjs/
          retention-days: 7
