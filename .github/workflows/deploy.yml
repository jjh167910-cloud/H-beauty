name: Deploy حنانه بیوتی

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a22c80a102037bf59a1a25426cb93d66' }}
      # Choose exactly one publishing system: GitHub Actions or Cloudflare Workers Builds.
      HBEAUTY_DEPLOY_MODE: ${{ vars.HBEAUTY_DEPLOY_MODE || 'github-actions' }}
      # Do not enable the new gallery until all 80 curated image assets are committed.
      VITE_MAKEUP_CURATED_40: ${{ vars.HBEAUTY_CURATED_40 || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify catalog images and PWA assets
        run: node scripts/verify-images.mjs
      - name: Verify offline app shell
        run: node --test tests-node/*.test.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify 40 curated makeup portraits when enabled
        if: ${{ env.VITE_MAKEUP_CURATED_40 == 'true' }}
        run: npm run verify:makeup-curated-40

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify runner Chrome
        run: google-chrome --version

      - name: Verify mobile UI before production
        run: npm run test:ui

      - name: Upload build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: h-beauty-dist
          path: dist
          retention-days: 14

      - name: Validate automatic deployment configuration
        run: |
          case "$HBEAUTY_DEPLOY_MODE" in
            github-actions)
              if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
                echo "::error title=Deployment blocked::CLOUDFLARE_API_TOKEN GitHub Actions repository secret is missing; builds must not be marked successfully deployed."
                echo "See docs/HBEAUTY_AUTOMATIC_CLOUDFLARE_SETUP.md"
                exit 1
              fi
              ;;
            cloudflare-builds)
              echo "Cloudflare Workers Builds selected. GitHub Actions only tests and packages; Cloudflare publishes from its own Git connection."
              ;;
            *)
              echo "::error::HBEAUTY_DEPLOY_MODE must be github-actions or cloudflare-builds, got: $HBEAUTY_DEPLOY_MODE"
              exit 1
              ;;
          esac

      - name: Deploy to Cloudflare Workers (GitHub Actions mode)
        if: ${{ env.HBEAUTY_DEPLOY_MODE == 'github-actions' }}
        run: npx --yes wrangler@4 deploy
