name: H-Beauty Atelier Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify catalog images and PWA assets
        run: node scripts/verify-images.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Vite
        run: npm run build
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Mobile RTL and booking regression
        run: npm run test:ui
      - name: Upload visual review
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-ui-review
          path: |
            test-results/
          retention-days: 7
