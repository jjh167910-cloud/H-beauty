name: H-Beauty Atelier Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify catalog images and PWA assets
        run: node scripts/verify-images.mjs
      - name: Verify offline app shell
        run: node --test tests-node/*.test.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build Vite
        run: npm run build
      - name: Verify Cloudflare Worker packaging without deploying
        # Reproduce Wrangler's configuration-driven build on a clean CI
        # checkout. No Cloudflare token or production mutation is required.
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/hbeauty-worker-preview
      - name: Verify optional 80-portrait release in Wrangler dry-run
        env:
          VITE_MAKEUP_CURATED_80: "true"
        run: |
          npm run prepare:makeup-curated-80
          npm run verify:makeup-curated-80
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/hbeauty-worker-curated80
      - name: Check GitHub publishing fallback readiness
        env:
          HAS_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_DEPLOY_TOKEN" = "true" ]; then
            echo "::notice::Direct deployment via GitHub Actions has a Cloudflare API token configured."
          else
            echo "::notice::GitHub direct deployment is unavailable without a Cloudflare API token secret."
          fi
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Mobile RTL and booking regression
        run: npm run test:ui
      - name: Upload visual review
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-ui-review
          path: |
            test-results/
          retention-days: 7

  curated80:
    # Exercise the actual portrait bytes, not only a code-only preview.
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/makeup80-') }}
    runs-on: ubuntu-latest
    env:
      VITE_MAKEUP_CURATED_80: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Fetch and verify all eighty real uploaded portraits
        run: |
          npm run prepare:makeup-curated-80
          npm run verify:makeup-curated-80
      - name: Typecheck the enabled makeup catalog
        run: npm run typecheck
      - name: Build complete offline makeup edition
        run: npm run build
      - name: Verify the 80-photo Chromium browser experience
        run: npx playwright test tests/makeup-80.spec.ts
      - name: Upload 80-look screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: makeup80-mobile-review
          path: test-results/
          retention-days: 7

  music-fixture:
    # No copyrighted recording is uploaded or published by this job.
    # The generated tone only tests the enabled music product path.
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/looping-background-music-') }}
    runs-on: ubuntu-latest
    env:
      VITE_SALON_MUSIC: "true"
      VITE_MAKEUP_CURATED_80: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install test audio encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate independent synthetic MP3 for music tests
        run: |
          mkdir -p public/audio
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:sample_rate=44100:duration=9" -ac 1 -ar 44100 -b:a 128k -y public/audio/hananeh-salon-ambience.mp3
          sha256sum public/audio/hananeh-salon-ambience.mp3 > assets/hananeh-salon-ambience.sha256
      - name: Typecheck with music enabled
        run: npm run typecheck
      - name: Build and precache sample audio
        run: |
          npm run build
          grep -q '/audio/hananeh-salon-ambience.mp3' dist/sw.js
      - name: Verify real playback, navigation and mute preference in Chromium
        run: npx playwright test tests/background-music.spec.ts
