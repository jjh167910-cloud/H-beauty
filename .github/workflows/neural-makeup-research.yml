name: H-Beauty Neural Makeup Research Gate

on:
  push:
    branches:
      - research/neural-makeup-v20
    paths:
      - 'experiments/neural-makeup/**'
      - '.github/workflows/neural-makeup-research.yml'
  pull_request:
    paths:
      - 'experiments/neural-makeup/**'
      - '.github/workflows/neural-makeup-research.yml'

permissions:
  contents: read

jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: experiments/neural-makeup/requirements.txt
      - name: Install CPU-only PyTorch and tests
        run: |
          python -m pip install --upgrade pip
          pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          pip install 'numpy>=1.26,<3' 'Pillow>=10,<13' 'pytest>=8,<10' 'onnx>=1.16,<2' 'onnxruntime>=1.18,<2'
      - name: Unit tests including exact off-region preservation
        run: pytest -q experiments/neural-makeup/tests/test_*.py
      - name: Full synthetic training smoke
        run: python experiments/neural-makeup/tests/smoke_pipeline.py
      - name: Offline browser ONNX hash and identity regression
        run: node --test experiments/neural-makeup/tests/test_browser_runtime.mjs experiments/neural-makeup/tests/test_reference_hybrid.mjs experiments/neural-makeup/tests/test_v194_matte.mjs experiments/neural-makeup/tests/test_v195_contrast.mjs experiments/neural-makeup/tests/test_v196_detail_atlas.mjs experiments/neural-makeup/tests/test_v197_tone.mjs experiments/neural-makeup/tests/test_v198_geometry.mjs experiments/neural-makeup/tests/test_v198_atlas.mjs experiments/neural-makeup/tests/test_v199_face_safety.mjs
      - name: Assert no embedded weights or people photos in research tree
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('experiments/neural-makeup')
          prohibited={'.pt','.pth','.safetensors','.onnx','.jpg','.jpeg','.png','.webp','.npz'}
          bad=[str(p) for p in root.rglob('*') if p.is_file() and p.suffix.lower() in prohibited]
          if bad:
              raise SystemExit('Research branch contains disallowed binary/image artifacts: '+', '.join(bad))
          print('PASS: no unlicensed model assets or real face photos committed')
          PY
